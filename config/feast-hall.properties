# Who-ville feast hall - arrangements for the Whobilation
# Written down because the Mayor loses paper. Do not lose this too.
#
# No address in here on purpose. Every Who already knows the way, and
# the Council voted that the way should not be written anywhere a
# stranger could read it. (Motion carried, one abstention: the Mayor,
# who wanted it on a banner.)

hall-name=The Tabard Inn
hall-keeper=Harry Bailly
hall-sign=look up at the signboard in the inn yard
gather-point=the yard, under the board, before the doors open

doors-open=18:00
seats=1024
bells=42
feast-mode=survival
difficulty=peaceful
whitelist=false
allow-carols=true
allow-roast-beast=true

# The keeper sets the terms, same as he always has: every pilgrim tells
# a tale on the way, and the best tale eats free. Ask him for his and he
# will give you the Pardoner's text, which is the only one he knows by
# heart, and he will give it to you in the Latin.
motd=Welcome, pilgrim. Tell us a tale and the ale is free.

# If you have forgotten the way to the hall, do not write to the Council.
# Ask any Who who has ever ridden out on pilgrimage. They all went from
# the same yard, and they all came back to it.
